name: sync upstream

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

# Pushes use FORK_SYNC_TOKEN, a fine-grained token for this fork and herdr-core
# (contents, workflows, actions): GITHUB_TOKEN may not push the upstream commits
# that change .github/workflows. The model resolver never shares a job with it.
permissions:
  contents: read

concurrency:
  group: fork-upstream-sync
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'alexshpunt/herdr-app'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.candidate.outputs.changed }}
      branch: ${{ steps.candidate.outputs.branch }}
      sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
      # Only for conflicts: a model resolves them (scripts/fork-resolve-conflicts); verify still
      # has to pass before master moves. Needs the OPENCODE_API_KEY repository secret.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.2'
      - name: Install the conflict resolver
        run: npm install -g @earendil-works/pi-coding-agent@1.5.0
      - name: Merge upstream into a local candidate
        id: candidate
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          result=$(python3 scripts/fork-sync.py prepare --resolver scripts/fork-resolve-conflicts --branch "automation/upstream-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}")
          printf '%s\n' "$result"
          printf '%s\n' "$result" | jq -r 'to_entries[] | "\(.key)=\(.value)"' >> "$GITHUB_OUTPUT"
      # Only the commits the fork lacks; publish rebuilds the branch from them in a clean job.
      - name: Bundle the candidate
        if: steps.candidate.outputs.changed == 'true'
        env:
          BRANCH: ${{ steps.candidate.outputs.branch }}
        run: git bundle create "$RUNNER_TEMP/candidate.bundle" "refs/heads/$BRANCH" ^refs/remotes/origin/master
      - if: steps.candidate.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate
          path: ${{ runner.temp }}/candidate.bundle
          retention-days: 3
  # A fresh checkout the resolver never touched pushes the exact candidate.
  publish:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate
          path: ${{ runner.temp }}
      - name: Push the candidate branch
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
          BRANCH: ${{ needs.prepare.outputs.branch }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo '::error::The FORK_SYNC_TOKEN repository secret is missing (see docs/FORK.md)'; exit 1; }
          git bundle verify "$RUNNER_TEMP/candidate.bundle"
          git fetch --no-tags "$RUNNER_TEMP/candidate.bundle" "refs/heads/$BRANCH:refs/heads/$BRANCH"
          gh auth setup-git
          python3 scripts/fork-sync.py publish --branch "$BRANCH" --sha "$SHA"
  verify:
    needs: [prepare, publish]
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      # The fork ships only the Windows build; Linux and macOS failures don't hold back a merge.
      windows_only: true
    permissions:
      contents: read
  land:
    needs: [prepare, verify]
    if: needs.verify.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
      # A push with FORK_SYNC_TOKEN, unlike one with GITHUB_TOKEN, starts the
      # master workflows itself, fork-release among them.
      - name: Fast-forward master to the exact verified commit
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
          CANDIDATE_BRANCH: ${{ needs.prepare.outputs.branch }}
          CANDIDATE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          gh auth setup-git
          python3 scripts/fork-sync.py land --branch "$CANDIDATE_BRANCH" --sha "$CANDIDATE_SHA"
